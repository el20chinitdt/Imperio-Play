<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IMPERIO PLAY | Televisión & EPG Dinámica</title>

    <!-- Meta etiquetas PWA -->
    <meta name="theme-color" content="#05070C">
    <meta name="apple-mobile-web-app-title" content="Imperio Play">
    <script>
        (function () {
            try {
                if (!/^https?:$/.test(location.protocol)) return;
                const draw = (n, pad, round) => {
                    const c = document.createElement('canvas'); c.width = c.height = n;
                    const x = c.getContext('2d');
                    const g = x.createLinearGradient(0, 0, n, n);
                    g.addColorStop(0, '#00A3FF'); g.addColorStop(1, '#0052CC');
                    x.fillStyle = g; x.beginPath();
                    if (round && x.roundRect) x.roundRect(0, 0, n, n, n * 0.22); else x.rect(0, 0, n, n);
                    x.fill();
                    const s = n * (1 - pad * 2), cx = n / 2 + s * 0.04, cy = n / 2, w = s * 0.46, h = s * 0.56;
                    x.fillStyle = '#FFB800'; x.beginPath();
                    x.moveTo(cx - w / 2, cy - h / 2); x.lineTo(cx - w / 2, cy + h / 2); x.lineTo(cx + w / 2, cy); x.closePath(); x.fill();
                    return c.toDataURL('image/png');
                };
                const i192 = draw(192, 0.22, true), i512 = draw(512, 0.22, true), iMask = draw(512, 0.30, false);
                const base = location.origin + location.pathname;
                const manifest = {
                    id: base, name: 'Imperio Play', short_name: 'Imperio Play',
                    description: 'TV en vivo con guía de programación',
                    start_url: base, scope: base.slice(0, base.lastIndexOf('/') + 1),
                    display: 'standalone', background_color: '#05070C', theme_color: '#05070C', lang: 'es',
                    icons: [
                        { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
                        { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' },
                        { src: iMask, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
                    ]
                };
                const add = (rel, href, type) => {
                    const l = document.createElement('link'); l.rel = rel; l.href = href;
                    if (type) l.type = type; document.head.appendChild(l);
                };
                add('manifest', URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' })));
                add('apple-touch-icon', i192);
                add('icon', i192, 'image/png');
            } catch (e) { console.warn('PWA:', e); }
        })();
    </script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fuentes e Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --rio-blue: #00A3FF;
            --rio-dark: #0052CC;
            --rio-gold: #FFB800;
            --bg-main: #05070C;
            --bg-card: rgba(14, 20, 32, 0.9);
            --bg-sidebar: #090D16;
            --border: rgba(0, 163, 255, 0.2);
            --text-main: #FFFFFF;
            --text-muted: #8E9BAE;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .app-root {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
        }

        header {
            height: 55px;
            background: #080C14;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            flex-shrink: 0;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 8px; }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--rio-blue), var(--rio-dark));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--rio-gold);
            font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 163, 255, 0.4);
        }

        .brand-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .brand-title span { color: var(--rio-gold); }

        .header-right { display: flex; align-items: center; gap: 8px; }

        .btn-install-app {
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, var(--rio-gold), #FF9900);
            color: #000;
            font-weight: 800;
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 184, 0, 0.4);
        }

        .live-tag {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 163, 255, 0.12);
            border: 1px solid rgba(0, 163, 255, 0.3);
            padding: 4px 8px;
            border-radius: 12px;
            color: var(--rio-blue);
            font-size: 10px;
            font-weight: 700;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--rio-gold);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--rio-gold);
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .app-body {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .player-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            overflow-y: auto;
        }

        [hidden] { display: none !important; }
        .player-stage { background: var(--bg-main); }

        .video-wrapper {
            position: relative;
            margin: 16px 16px 0;
            align-self: stretch;
            aspect-ratio: 16/9;
            max-height: 55vh;
            flex-shrink: 0;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 30px rgba(0, 163, 255, 0.06);
        }
        .video-wrapper:fullscreen, .video-wrapper:-webkit-full-screen {
            margin: 0; width: 100%; height: 100%; max-height: none; aspect-ratio: auto; border: 0; border-radius: 0;
        }
        .video-wrapper:not(.ui) { cursor: none; }

        video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }

        .stream-msg {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.45);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            padding: 16px;
            pointer-events: none;
        }
        .stream-msg.on { display: flex; }
        .stream-msg.err { background: rgba(5, 7, 12, 0.9); pointer-events: auto; }
        .spinner {
            width: 40px; height: 40px; border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: var(--rio-gold); border-right-color: var(--rio-blue);
            animation: spin 0.8s linear infinite;
        }
        .stream-msg.err .spinner { display: none; }
        .err-ic { display: none; font-size: 32px; color: var(--rio-gold); }
        .stream-msg.err .err-ic { display: block; }
        #stream-msg-txt:empty { display: none; }
        .stream-msg button {
            display: flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, var(--rio-blue), var(--rio-dark));
            color: #fff; border: none; border-radius: 18px;
            padding: 8px 18px; font-weight: 700; font-size: 12px; cursor: pointer;
            box-shadow: 0 0 14px rgba(0, 163, 255, 0.35);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .vp-ui {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
        }
        .video-wrapper.ui .vp-ui { opacity: 1; pointer-events: auto; }

        .vp-top {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 12px 14px 30px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), transparent);
        }
        .vp-ch { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .vp-ch-txt { display: flex; flex-direction: column; min-width: 0; }
        .vp-ch-name { font-size: 13px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .vp-ch-show { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .vp-live {
            display: flex; align-items: center; gap: 6px; flex-shrink: 0;
            background: rgba(255, 59, 59, 0.16); border: 1px solid rgba(255, 59, 59, 0.45);
            color: #ff6b6b; font-size: 10px; font-weight: 800; letter-spacing: 0.6px;
            padding: 4px 9px; border-radius: 12px;
        }
        .vp-live i { width: 6px; height: 6px; border-radius: 50%; background: #ff3b3b; box-shadow: 0 0 6px #ff3b3b; animation: blink 1.5s infinite; }

        .logo-box {
            width: 40px; height: 30px; background: #111; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo-box img { width: 100%; height: 100%; object-fit: contain; }

        .vp-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .vp-big {
            display: none; align-items: center; justify-content: center;
            width: 68px; height: 68px; padding-left: 4px; border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(0, 0, 0, 0.45);
            -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
            color: #fff; font-size: 24px; cursor: pointer; pointer-events: auto;
            box-shadow: 0 0 24px rgba(0, 163, 255, 0.3);
        }
        .video-wrapper.paused .vp-big { display: flex; }

        .vp-bottom { padding: 28px 12px 10px; background: linear-gradient(to top, rgba(0, 0, 0, 0.92), transparent); }
        .vp-progress { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.18); margin-bottom: 10px; overflow: hidden; }
        .vp-progress div { height: 100%; width: 0; background: linear-gradient(90deg, var(--rio-blue), var(--rio-gold)); transition: width 0.4s ease; }
        .vp-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .vp-group { display: flex; align-items: center; gap: 6px; }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff; width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 13px; transition: background 0.15s, transform 0.1s;
        }
        .btn-ctrl:hover { background: rgba(0, 163, 255, 0.4); }
        .btn-ctrl:active { transform: scale(0.92); }
        .btn-ctrl.primary { width: 42px; height: 42px; font-size: 15px; border: none; background: linear-gradient(135deg, var(--rio-blue), var(--rio-dark)); box-shadow: 0 0 14px rgba(0, 163, 255, 0.4); }

        .vol { display: flex; align-items: center; gap: 4px; }
        .vol input {
            -webkit-appearance: none; appearance: none; width: 72px; height: 4px; border-radius: 2px;
            background: rgba(255, 255, 255, 0.25); outline: none; cursor: pointer; user-select: auto;
        }
        .vol input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--rio-gold); border: 0; }
        .vol input::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--rio-gold); border: 0; }
        @media (hover: none) { .vol input { display: none; } }

        .epg-container { padding: 16px; background: var(--bg-main); flex: 1; }

        .epg-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .epg-header-info { display: flex; align-items: center; gap: 12px; }

        .epg-logo-box {
            width: 50px;
            height: 50px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .epg-logo-box img { width: 100%; height: 100%; object-fit: contain; }

        .epg-badge { font-size: 10px; font-weight: 700; color: var(--rio-blue); text-transform: uppercase; }
        .epg-channel-name { font-size: 16px; font-weight: 800; color: #fff; }

        .epg-current-show {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
        }

        .show-name {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .show-time { font-size: 11px; color: var(--rio-gold); font-weight: 600; white-space: nowrap; }

        .show-desc { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }

        .epg-progress-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }

        .epg-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--rio-blue), var(--rio-gold));
            transition: width 0.4s ease;
        }

        .epg-next { margin-top: 10px; font-size: 11px; color: var(--text-muted); line-height: 1.6; }
        .epg-next b { color: var(--rio-gold); font-weight: 600; margin-right: 6px; }

        .channels-sidebar {
            width: 340px;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            min-height: 0;
        }

        .sidebar-header {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-box { position: relative; }
        .search-box i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 12px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 8px 8px 30px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 12px;
            user-select: text;
        }

        .cat-pills { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }

        .cat-chip {
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 10px;
            white-space: nowrap;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cat-chip.active {
            background: var(--rio-blue);
            color: #fff;
            font-weight: 700;
            border-color: transparent;
        }

        .channels-grid {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .channel-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
        }

        .channel-card.active {
            background: rgba(0, 163, 255, 0.15);
            border-color: var(--rio-blue);
            box-shadow: inset 3px 0 0 var(--rio-gold);
        }

        .ch-logo-small {
            width: 36px;
            height: 36px;
            background: #000;
            padding: 3px;
            border-radius: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .ch-logo-small img { width: 100%; height: 100%; object-fit: contain; }

        .channel-card-details { flex: 1; overflow: hidden; }
        .channel-card-name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-card-cat { font-size: 10px; color: var(--text-muted); }
        .fav-btn { background: none; border: none; color: #3d4859; font-size: 16px; cursor: pointer; padding: 4px 6px; }
        .fav-btn.on { color: var(--rio-gold); }
        .fallback-txt {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            border-radius: 4px; font-size: 10px; font-weight: 800; letter-spacing: 0.3px; color: #fff;
            background: linear-gradient(135deg, hsl(var(--h, 210) 70% 40%), hsl(calc(var(--h, 210) + 40) 70% 26%));
        }

        @media (max-width: 800px) {
            .app-body { flex-direction: column; overflow-y: auto; }
            .player-stage { flex: none; position: sticky; top: 0; z-index: 50; background: #000; overflow: visible; }
            .video-wrapper { width: 100%; margin: 0; align-self: auto; border-radius: 0; border-width: 0 0 1px; box-shadow: none; height: 210px; max-height: 32vh; aspect-ratio: auto; }
            .epg-container { padding: 10px; flex: none; }
            .channels-sidebar { width: 100%; flex: 1; border-left: none; border-top: 1px solid var(--border); }
            .channels-grid { overflow-y: visible; }
        }
    </style>
</head>
<body>

    <div class="app-root">
        <header>
            <div class="brand">
                <div class="brand-icon"><i class="fa-solid fa-play"></i></div>
                <div class="brand-title">IMPERIO <span>PLAY</span></div>
            </div>
            <div class="header-right">
                <button class="btn-install-app" id="btn-pwa">
                    <i class="fa-solid fa-download"></i>
                    <span>Descargar App</span>
                </button>
                <div class="live-tag">
                    <div class="live-dot"></div>
                    <span>EN VIVO</span>
                </div>
            </div>
        </header>

        <div class="app-body">
            <main class="player-stage">
                <div class="video-wrapper paused ui" id="video-wrapper">
                    <video id="video-element" autoplay playsinline></video>
                    <div class="stream-msg" id="stream-msg">
                        <div class="spinner"></div>
                        <i class="fa-solid fa-triangle-exclamation err-ic"></i>
                        <span id="stream-msg-txt">Cargando…</span>
                        <button id="btn-retry" hidden><i class="fa-solid fa-rotate-right"></i> Reintentar</button>
                    </div>
                    <div class="vp-ui">
                        <div class="vp-top">
                            <div class="vp-ch">
                                <div class="logo-box">
                                    <img id="player-ch-logo" referrerpolicy="no-referrer" alt="" onerror="handleImgError(this)">
                                </div>
                                <div class="vp-ch-txt">
                                    <span class="vp-ch-name" id="player-ch-title">Seleccioná canal</span>
                                    <span class="vp-ch-show" id="player-show">En vivo</span>
                                </div>
                            </div>
                            <div class="vp-live"><i></i>EN VIVO</div>
                        </div>
                        <div class="vp-center">
                            <button class="vp-big" id="btn-center" aria-label="Reproducir"><i class="fa-solid fa-play"></i></button>
                        </div>
                        <div class="vp-bottom">
                            <div class="vp-progress"><div id="player-progress"></div></div>
                            <div class="vp-bar">
                                <div class="vp-group">
                                    <button class="btn-ctrl" id="btn-prev" aria-label="Canal anterior"><i class="fa-solid fa-backward-step"></i></button>
                                    <button class="btn-ctrl primary" id="btn-play-pause" aria-label="Pausar"><i class="fa-solid fa-pause"></i></button>
                                    <button class="btn-ctrl" id="btn-next" aria-label="Canal siguiente"><i class="fa-solid fa-forward-step"></i></button>
                                    <div class="vol">
                                        <button class="btn-ctrl" id="btn-mute" aria-label="Silenciar"><i class="fa-solid fa-volume-high"></i></button>
                                        <input type="range" id="vol-range" min="0" max="1" step="0.02" value="1" aria-label="Volumen">
                                    </div>
                                </div>
                                <div class="vp-group">
                                    <button class="btn-ctrl" id="btn-pip" aria-label="Imagen en imagen"><i class="fa-regular fa-window-restore"></i></button>
                                    <button class="btn-ctrl" id="btn-fullscreen" aria-label="Pantalla completa"><i class="fa-solid fa-expand"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="epg-container">
                    <div class="epg-card">
                        <div class="epg-header-info">
                            <div class="epg-logo-box">
                                <img id="epg-ch-logo" referrerpolicy="no-referrer" alt="" onerror="handleImgError(this)">
                            </div>
                            <div class="epg-title-box">
                                <div class="epg-badge" id="epg-ch-group">ARGENTINA</div>
                                <div class="epg-channel-name" id="epg-ch-name">Cargando...</div>
                            </div>
                        </div>

                        <div class="epg-current-show">
                            <div class="show-name">
                                <span id="epg-show-title">Descargando EPG en vivo...</span>
                                <span class="show-time" id="epg-show-time">--:--</span>
                            </div>
                            <div class="show-desc" id="epg-show-desc">Conectando a las fuentes XMLTV para sincronizar la programación del día...</div>
                            <div class="epg-progress-bg">
                                <div class="epg-progress-fill" id="epg-progress"></div>
                            </div>
                            <div class="epg-next" id="epg-next"></div>
                        </div>
                    </div>
                </div>

        async function getJson(u) {

        function pickLogos(list, ids) {

                const sc = (l.feed ? 0 : 2) + ((l.tags || []).includes('white') ? 1 : 0);
                if (best[l.channel] === undefined || sc > best[l.channel]) { best[l.channel] = sc; m[l.channel] = l.url; }
            }
            return m;

                        if (pick) alt[pick] = c.id;

                    const m2 = pickLogos(logos, new Set(Object.keys(alt)));

        const TVL_FOLDERS = ['argentina', 'world-latin-america', 'united-states', 'spain', 'france', 'united-kingdom', 'international', 'mexico', 'world-europe'];
        const TVL_RAW = 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/';
        const LOGO_ALIAS = {
            'InvestigationDiscovery.lat': 'Investigation Discovery', 'SonyChannel.lat': 'Sony Channel',

            'WarnerChannel.lat': 'Warner TV', 'AdultSwimLatinAmerica.us': 'Adult Swim',

        async function listFolder(f) {
            const t = await getJson('https://api.github.com/repos/tv-logo/tv-logos/git/trees/' + encodeURIComponent('main:countries/' + f));
            if (t && Array.isArray(t.tree)) return t.tree.filter(x => x.type === 'blob').map(x => x.path);
            const c = await getJson('https://api.github.com/repos/tv-logo/tv-logos/contents/countries/' + f);

            const idx = {}; let ok = 0;
            const lists = await Promise.all(TVL_FOLDERS.map(listFolder));
            lists.forEach((files, n) => {
                if (!files) return;
                ok++;
                files.filter(f => /\.png$/i.test(f)).sort((x, y) => /-hz-/.test(x) - /-hz-/.test(y)).forEach(f => {
                    const slug = f.replace(/\.png$/i, '').replace(/-(hz-)?[a-z]{2,3}$/, '').replace(/-/g, ' ');
                    const url = TVL_RAW + TVL_FOLDERS[n] + '/' + f;
                    [norm(slug), norm2(slug)].forEach(k => { if (k && !idx[k]) idx[k] = url; });
                });
            });
            if (!ok) return;
            const m = {};
            channels.forEach(c => {
                const keys = [norm(c.name), norm2(c.name), LOGO_ALIAS[c.id] && norm(LOGO_ALIAS[c.id]), norm(c.id), norm2(c.id)];
                const k = keys.find(k => k && idx[k]);
                if (k) m[c.id] = idx[k];
            });
            store.set('ip_tvl', { t: Date.now(), ttl: ok === TVL_FOLDERS.length ? 6048e5 : 36e5, m });
            applyRepo(m);
        }

        // ---------- EPG ----------
        function parseXmlTvDate(s) {
            const m = s.match(/^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)?\s*([+-])?(\d\d)?(\d\d)?/);
            if (!m) return null;
            const off = m[7] ? (m[7] === '-' ? -1 : 1) * (+m[8] * 60 + (+m[9] || 0)) : 0;
            return new Date(Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) - off * 6e4);
        }
        async function getXml(u) {
            for (const f of [u, buildProxyUrl(u)]) {
                try {
                    const r = await fetch(f);
                    if (!r.ok) continue;
                    const b = await r.arrayBuffer(), u8 = new Uint8Array(b);
                    const t = u8[0] === 0x1f && u8[1] === 0x8b && window.DecompressionStream
                        ? await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
                        : new TextDecoder().decode(b);
                    if (t.includes('<programme')) return t;
                } catch {}
            }
            return null;
        }
        function pool(n) {
            let active = 0; const q = [];
            const go = () => {
                while (active < n && q.length) { active++; q.shift()().finally(() => { active--; go(); }); }
            };
            return fn => new Promise((res, rej) => { q.push(() => fn().then(res, rej)); go(); });
        }
        async function fetchAndParseXmlTv() {
            const byId = {}, byA = {}, byB = {};
            channels.forEach(c => {
                byId[c.id] = c;
                byA[norm(c.id)] = c; byA[norm(c.name)] = c;
                byB[norm2(c.id)] = c; byB[norm2(c.name)] = c;
            });
            const look = (map, k) => k ? map[k] : undefined;
            const from = Date.now() - 3 * 36e5, to = Date.now() + 30 * 36e5;
            const data = {};
            epgScheduleData = data;
            const gate = pool(3);
            const jobs = XMLTV_SOURCES.map(u => gate(() => getXml(u)));

            for (const job of jobs) {
                const xml = await job;
                epgDone++;
                if (xml && xml.length < 9e7) {
                    try {
                        const doc = new DOMParser().parseFromString(xml, 'text/xml');
                        const map = {}, claimed = new Set();
                        doc.querySelectorAll('channel').forEach(el => {
                            const id = el.getAttribute('id') || '';
                            const names = [...el.querySelectorAll('display-name')].map(n => n.textContent);
                            const hit = byId[id] || look(byA, norm(id)) || names.map(n => look(byA, norm(n))).find(Boolean)
                                || look(byB, norm2(id)) || names.map(n => look(byB, norm2(n))).find(Boolean);
                            if (hit && !data[hit.id] && !claimed.has(hit.id)) { map[id] = hit.id; claimed.add(hit.id); }
                        });
                        doc.querySelectorAll('programme').forEach(p => {
                            const cid = map[p.getAttribute('channel')];
                            if (!cid) return;
                            const s = parseXmlTvDate(p.getAttribute('start') || ''), e = parseXmlTvDate(p.getAttribute('stop') || '');
                            const t = p.querySelector('title');
                            if (!s || !e || !t || e < from || s > to) return;
                            (data[cid] = data[cid] || []).push({ start: s, stop: e, title: t.textContent, desc: p.querySelector('desc')?.textContent || '' });
                        });
                        claimed.forEach(id => { if (data[id]) data[id].sort((x, y) => x.start - y.start); });
                    } catch (err) { console.warn('EPG:', err); }
                }
                epgMatched = Object.keys(data).length;
                updateDynamicEpg();
            }
            epgState = epgMatched ? 'ok' : 'fail';
            updateDynamicEpg();
        }

        function updateDynamicEpg() {
            if (!currentChannel) return;
            const now = new Date(), list = epgScheduleData[currentChannel.id] || [];
            const i = list.findIndex(p => now >= p.start && now < p.stop);
            epgNext.innerHTML = '';
            if (i < 0) {
                epgShowTitle.innerText = `${currentChannel.name} - En Vivo`;
                epgShowTime.innerText = 'En Vivo';
                epgProgress.style.width = '100%';
                playerShow.innerText = 'En vivo';
                playerProgress.style.width = '100%';
                epgShowDesc.innerText =
                    epgState === 'loading' ? `Buscando la guía en ${XMLTV_SOURCES.length} fuentes... (${epgDone}/${XMLTV_SOURCES.length}, ${epgMatched} canales con guía)` :
                    epgState === 'fail' ? 'No se pudo descargar la guía desde ninguna fuente XMLTV.' :
                    `Ninguna fuente trae programación para este canal (${epgMatched} de ${channels.length} canales tienen guía).`;
                return;
            }
            const p = list[i];
            epgShowTitle.innerText = p.title;
            epgShowTime.innerText = `${hhmm(p.start)} - ${hhmm(p.stop)} HS`;
            epgShowDesc.innerText = p.desc || 'Sin descripción disponible para este programa.';
            const pct = Math.min(100, Math.max(2, Math.round((now - p.start) / (p.stop - p.start) * 100))) + '%';
            epgProgress.style.width = pct;
            playerProgress.style.width = pct;
            playerShow.innerText = p.title;
            epgNext.innerHTML = list.slice(i + 1, i + 4).map(n => `<div><b>${hhmm(n.start)}</b>${esc(n.title)}</div>`).join('');
        }

        const tryPlay = () => video.play().catch(() => { setMsg(''); syncPlay(); });
        function streamFail() { setMsg(`No se pudo cargar ${currentChannel.name}. Puede que el canal esté caído.`, true); }

        function loadStream() {
            setMsg('Cargando…');
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            video.removeAttribute('src');
            if (window.Hls && Hls.isSupported()) {
                hlsInstance = new Hls({ enableWorker: true });
                hlsInstance.loadSource(currentChannel.proxiedUrl);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => tryPlay());
                hlsInstance.on(Hls.Events.ERROR, (_, d) => {
                    if (!d.fatal) return;
                    if (retries++ < 3) {
                        if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hlsInstance.recoverMediaError();
                        else setTimeout(() => hlsInstance && hlsInstance.startLoad(), 1500 * retries);
                    } else streamFail();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = currentChannel.proxiedUrl;
                tryPlay();
            } else streamFail();
        }

        function switchChannel(channel) {

        video.addEventListener('playing', () => setMsg(''));

        // Controles del player
        const wrap = $('video-wrapper'), btnCenter = $('btn-center'), btnMute = $('btn-mute'),
              volRange = $('vol-range'), btnPip = $('btn-pip');
        let uiTimer = null;
        function showUi() {
            wrap.classList.add('ui');
            clearTimeout(uiTimer);
            if (!video.paused) uiTimer = setTimeout(() => wrap.classList.remove('ui'), 3000);
        }
        function syncPlay() {
            const p = video.paused;
            wrap.classList.toggle('paused', p);
            btnPlayPause.innerHTML = `<i class="fa-solid fa-${p ? 'play' : 'pause'}"></i>`;
            btnPlayPause.setAttribute('aria-label', p ? 'Reproducir' : 'Pausar');
            showUi();
        }
        const togglePlay = () => video.paused ? video.play().catch(syncPlay) : video.pause();
        ['play', 'pause', 'playing', 'loadstart', 'emptied', 'ended'].forEach(ev => video.addEventListener(ev, syncPlay));
        btnPlayPause.onclick = btnCenter.onclick = togglePlay;

        wrap.addEventListener('mousemove', showUi);
        wrap.addEventListener('mouseleave', () => { if (!video.paused) wrap.classList.remove('ui'); });
        
        // MODIFICACIÓN SOLICITADA: Clic en la pantalla solo muestra/oculta la UI, NUNCA hace pausa.
        wrap.addEventListener('click', e => {
            if (e.target.closest('button, input')) return;
            showUi();
        });
        
        wrap.addEventListener('dblclick', e => { if (!e.target.closest('button, input')) btnFullscreen.click(); });

        function syncVol() {
            const v = video.muted ? 0 : video.volume;
            volRange.value = v;
            btnMute.innerHTML = `<i class="fa-solid fa-${v === 0 ? 'volume-xmark' : v < 0.5 ? 'volume-low' : 'volume-high'}"></i>`;
            store.set('ip_vol', { v: video.volume, m: video.muted });
        }
        const sv = store.get('ip_vol', null);
        if (sv) { video.volume = Math.min(1, Math.max(0, +sv.v || 0)); video.muted = !!sv.m; }
        video.addEventListener('volumechange', syncVol);
        syncVol();
        volRange.oninput = () => { video.muted = false; video.volume = +volRange.value; };
        volRange.onchange = () => volRange.blur();
        btnMute.onclick = () => { video.muted = !video.muted; if (!video.muted && video.volume === 0) video.volume = 0.5; };

        if (document.pictureInPictureEnabled && video.requestPictureInPicture) {
            btnPip.onclick = () => (document.pictureInPictureElement ? document.exitPictureInPicture() : video.requestPictureInPicture()).catch(() => {});
        } else btnPip.hidden = true;

        function stepChannel(dir) {
            const l = visibleChannels(); if (!l.length) return;
            const n = l.findIndex(c => currentChannel && c.i === currentChannel.i);
            switchChannel(l[((n < 0 ? 0 : n) + dir + l.length) % l.length]);
        }
        $('btn-prev').onclick = () => stepChannel(-1);
        $('btn-next').onclick = () => stepChannel(1);

        const fsIcon = () => {
            const on = document.fullscreenElement || document.webkitFullscreenElement;
            btnFullscreen.innerHTML = `<i class="fa-solid fa-${on ? 'compress' : 'expand'}"></i>`;
        };
        document.addEventListener('fullscreenchange', fsIcon);
        document.addEventListener('webkitfullscreenchange', fsIcon);

        btnFullscreen.onclick = async () => {
            const d = document;
            if (d.fullscreenElement || d.webkitFullscreenElement) {
                if (d.exitFullscreen) d.exitFullscreen();
                else if (d.webkitExitFullscreen) d.webkitExitFullscreen();
                try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e) {}
                return;
            }
            const w = $('video-wrapper');
            const r = w.requestFullscreen || w.webkitRequestFullscreen;
            if (r) {
                r.call(w);
                try {
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape');
                    }
                } catch(e) {}
            } else if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
            }
        };

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e) {}
            }
        });

        // ---------- SOPORTE DE CONTROL REMOTO Y TECLADO ----------
        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT') return;
            const k = e.key.toLowerCase();
            
            // Cambio de canal (Flechas arriba/abajo o botones de canal del control físico)
            if (e.key === 'ArrowUp' || e.key === 'ChannelUp') {
                e.preventDefault();
                stepChannel(-1);
            }
            else if (e.key === 'ArrowDown' || e.key === 'ChannelDown') {
                e.preventDefault();
                stepChannel(1);
            }
            // Reproducir / Pausa por atajo o tecla multimedia dedicada
            else if (k === 'k' || e.key === 'MediaPlayPause') {
                e.preventDefault();
                togglePlay();
            }
            // Silencio
            else if (k === 'm' || e.key === 'AudioVolumeMute') {
                btnMute.click();
            }
            // Subir volumen con control remoto
            else if (e.key === 'AudioVolumeUp' || e.key === 'VolumeUp') {
                e.preventDefault();
                video.muted = false;
                video.volume = Math.min(1, video.volume + 0.05);
            }
            // Bajar volumen con control remoto
            else if (e.key === 'AudioVolumeDown' || e.key === 'VolumeDown') {
                e.preventDefault();
                video.muted = false;
                video.volume = Math.max(0, video.volume - 0.05);
            }
        });

        // Media Session API para controles multimedia del sistema/TV
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('nexttrack', () => stepChannel(1));
            navigator.mediaSession.setActionHandler('previoustrack', () => stepChannel(-1));
            navigator.mediaSession.setActionHandler('play', () => video.play());
            navigator.mediaSession.setActionHandler('pause', () => video.pause());
        }

        // ---------- LISTA DE CANALES ----------
        const cats = [['ALL', 'Todos'], ['★ Favoritos', '★ Favoritos'], ...[...new Set(channels.map(c => c.group))].map(g => [g, g])];
        catPills.innerHTML = cats.map(([k, l]) => `<div class="cat-chip${k === 'ALL' ? ' active' : ''}" data-cat="${esc(k)}">${esc(l)}</div>`).join('');

        function visibleChannels() {
            const q = searchInput.value.toLowerCase();
            return channels.filter(ch =>
                (selectedCategory === 'ALL' || (selectedCategory === '★ Favoritos' ? favs.has(ch.id) : ch.group === selectedCategory)) &&
                (ch.name.toLowerCase().includes(q) || ch.group.toLowerCase().includes(q)));
        }

        function renderChannels() {
            gridContainer.innerHTML = '';
            visibleChannels().forEach(ch => {
                const first = logoChain(ch)[0];
                const card = document.createElement('div');
                card.className = 'channel-card' + (currentChannel && currentChannel.i === ch.i ? ' active' : '');
                card.innerHTML = `
                    <div class="ch-logo-small">
                        ${first ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(first)}" data-s="0" data-ch="${ch.i}" alt="" onerror="handleImgError(this)">`
                                : `<span class="fallback-txt" style="--h:${hue(ch)}">${esc(initials(ch))}</span>`}
                    </div>
                    <div class="channel-card-details">
                        <div class="channel-card-name">${esc(ch.name)}</div>
                        <div class="channel-card-cat">${esc(ch.group)}</div>
                    </div>
                    <button class="fav-btn${favs.has(ch.id) ? ' on' : ''}" aria-label="Favorito">${favs.has(ch.id) ? '★' : '☆'}</button>`;
                card.onclick = e => {
                    if (e.target.closest('.fav-btn')) {
                        favs.has(ch.id) ? favs.delete(ch.id) : favs.add(ch.id);
                        store.set('ip_favs', [...favs]);
                        return renderChannels();
                    }
                    switchChannel(ch);
                };
                gridContainer.appendChild(card);
            });
        }

        searchInput.oninput = renderChannels;
        catPills.onclick = e => {
            const chip = e.target.closest('.cat-chip');
            if (!chip) return;
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            selectedCategory = chip.dataset.cat;
            renderChannels();
        };

        // ---------- PWA ----------
        let deferredPrompt = null;
        const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
        if (isStandalone) btnPwa.style.display = 'none';
        window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
        window.addEventListener('appinstalled', () => { deferredPrompt = null; btnPwa.style.display = 'none'; });
        btnPwa.onclick = async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                if (outcome === 'accepted') btnPwa.style.display = 'none';
                return;
            }
            alert(/iphone|ipad|ipod/i.test(navigator.userAgent)
                ? "En iPhone/iPad: tocá el botón Compartir (cuadrado con flecha) y elegí «Agregar a pantalla de inicio»."
                : "Abrí el menú del navegador (⋮) y elegí «Instalar app» o «Agregar a la pantalla principal».");
        };

        // ---------- INICIO ----------
        document.addEventListener('DOMContentLoaded', () => {
            renderChannels();
            switchChannel(channels.find(c => c.id === store.get('ip_last', '')) || channels[0]);
            loadLogos();
            loadRepoLogos();
            fetchAndParseXmlTv();
            setInterval(updateDynamicEpg, 30000);
        });
    </script>
</body>
</html>
